<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrantes — FeiraCircular</title>
  <link rel="stylesheet" href="CSS/inicio.css" />
  <link rel="stylesheet" href="CSS/cadastro.css" />
  <link rel="stylesheet" href="CSS/integrantes.css" />
  <link rel="stylesheet" href="CSS/navegacao.css" />
</head>
<body>

  <!-- HEADER DINÂMICO -->
  <header class="header">
    <div class="container header__inner">
      <a href="inicio.html" class="logo">
        <img src="IMG/LogoSemFundo.png" alt="Logo FeiraCircular" class="logo-img">
      </a>
      <button class="menu-hamburger" type="button" data-menu-toggle aria-controls="menu-dinamico" aria-expanded="false" aria-label="Abrir menu">
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="nav" id="menu-dinamico">
        <!-- O JS preenche os links -->
      </nav>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container main">
    <div class="page-header">
      <h1>Equipe do Projeto</h1>
      <p>Acesse os perfis da equipe no GitHub e LinkedIn.</p>
    </div>

    <!-- CONTAINER DO GRÁFICO (CONSTELAÇÃO COM MAIS ESPAÇO) -->
    <div class="constelacao-container">
      
      <!-- Círculo Órbita SVG maior e espaçado (raio 215) -->
      <svg class="orbita-svg" viewBox="0 0 700 580">
        <circle cx="350" cy="290" r="215" class="linha-orbita" />
      </svg>

      <!-- Círculo Central com a Logo Oficial -->
      <div class="circulo-central">
        <img src="IMG/LogoSemFundo.png" alt="Logo FeiraCircular" class="logo-central-img">
      </div>

      <!-- Integrante 1 (Topo) -->
      <div class="no-integrante pos-1">
        <div class="bolinha-foto">
          <img src="IMG/Renato.jpeg" alt="Renato Carvalho Barbosa">
        </div>
        <div class="info-card">
          <h3>Renato Carvalho Barbosa</h3>
          <div class="links-sociais">
            <a href="https://github.com/RenatoCBarbosa" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/renato-barbosa-896b08381/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          </div>
        </div>
      </div>

      <!-- Integrante 2 (Direita Superior) -->
      <div class="no-integrante pos-2">
        <div class="bolinha-foto">
          <img src="IMG/Leo.jpeg" alt="Leonel Gonçalves de Almeida">
        </div>
        <div class="info-card">
          <h3>Leonel Gonçalves de Almeida</h3>
          <div class="links-sociais">
            <a href="https://github.com/Leo9dois8" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/leonelalmeida/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          </div>
        </div>
      </div>

      <!-- Integrante 3 (Direita Inferior) -->
      <div class="no-integrante pos-3">
        <div class="bolinha-foto">
          <img src="IMG/Pedro.jpeg" alt="Pedro Silva de Lima">
        </div>
        <div class="info-card">
          <h3>Pedro Silva de Lima</h3>
          <div class="links-sociais">
            <a href="https://github.com/pedrosilvadelima2206-ux" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </div>
      </div>

      <!-- Integrante 4 (Esquerda Inferior) -->
      <div class="no-integrante pos-4">
        <div class="bolinha-foto">
          <img src="IMG/Arthur.jpeg" alt="Arthur Lopes da Silva">
        </div>
        <div class="info-card">
          <h3>Arthur Lopes da Silva</h3>
          <div class="links-sociais">
            <a href="https://github.com/ArthurLope5S" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/arthur-lopes-943814263/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          </div>
        </div>
      </div>

      <!-- Integrante 5 (Esquerda Superior) -->
      <div class="no-integrante pos-5">
        <div class="bolinha-foto">
          <img src="IMG/Bruno.jpeg" alt="Bruno Correia da Silva">
        </div>
        <div class="info-card">
          <h3>Bruno Correia da Silva</h3>
          <div class="links-sociais">
            <a href="https://github.com/Beloot" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/bruno-correia-54a96b42a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="JS/auth.js"></script>
</body>
</html>
