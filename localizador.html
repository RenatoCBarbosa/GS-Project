<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2e7d32" />
  <title>Feiras próximas — FeiraCircular</title>
  <link rel="stylesheet" href="CSS/localizador.css" />
  <link rel="stylesheet" href="CSS/navegacao.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="inicio.html" class="logo">
        <img src="IMG/LogoSemFundo.png" alt="FeiraCircular — início" class="logo-img">
      </a>
      <button class="menu-hamburger" type="button" data-menu-toggle aria-controls="menu-dinamico" aria-expanded="false" aria-label="Abrir menu">
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="nav" id="menu-dinamico" aria-label="Navegação principal"></nav>
    </div>
  </header>

  <main class="container main">
    <header class="page-header">
      <h1>Feiras próximas de você</h1>
      <p>Compartilhe sua localização para ordenar os pontos de referência pela distância. As localizações abaixo são aproximadas e servem para demonstração.</p>
    </header>

    <section class="localizador-acoes" aria-label="Localização">
      <button type="button" class="btn" id="btn-localizacao">Usar minha localização</button>
      <p class="localizador-status" id="localizador-status" role="status" aria-live="polite">
        Ative a localização para calcular a distância até cada feira.
      </p>
    </section>

    <section class="grid-feiras" id="lista-feiras" aria-label="Feiras cadastradas"></section>
  </main>

  <script src="JS/auth.js"></script>
  <script src="JS/localizador.js"></script>
</body>
</html>
