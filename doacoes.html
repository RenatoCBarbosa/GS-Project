<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doações — FeiraCircular</title>
  <link rel="stylesheet" href="CSS/doacoes.css" />
  <link rel="stylesheet" href="CSS/navegacao.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="inicio.html" class="logo"><img src="IMG/LogoSemFundo.png" alt="Logo" class="logo-img"></a>
      <button class="menu-hamburger" type="button" data-menu-toggle aria-controls="menu-dinamico" aria-expanded="false" aria-label="Abrir menu">
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="nav" id="menu-dinamico"></nav>
    </div>
  </header>

  <main class="container main">
    <div class="page-header">
      <h1>Mural de Doações</h1>
      <p>Espaço exclusivo para Organizações Sociais. Encontre alimentos próprios para consumo e solicite a retirada.</p>
    </div>

    <section class="filtros">
      <input type="text" id="filtro-busca" placeholder="Buscar alimento ou barraca..." />
      <select id="filtro-feira"><option value="todas">Todas as feiras</option></select>
    </section>

    <section class="grid-ofertas" id="lista-doacoes"></section>
    <div id="msg-vazio" class="msg-vazio" style="display: none;">
      <h3>Nenhuma doação disponível agora.</h3>
    </div>
  </main>

  <script src="JS/auth.js"></script>
  <script src="JS/doacoes.js"></script>
</body>
</html>
