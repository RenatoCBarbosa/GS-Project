<!DOCTYPE html>
<!-- Página de entrada após a escolha do perfil; o conteúdo muda conforme quem está usando. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início — FeiraCircular</title>
  <link rel="stylesheet" href="CSS/inicio.css" />
  <link rel="stylesheet" href="CSS/navegacao.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <!-- O JavaScript preenche este menu com os links permitidos para cada perfil. -->
  <header class="header">
    <div class="container header__inner">
      <a href="inicio.html" class="logo"><img src="IMG/LogoSemFundo.png" alt="Logo" class="logo-img"></a>
      <button class="menu-hamburger" type="button" data-menu-toggle aria-controls="menu-dinamico" aria-expanded="false" aria-label="Abrir menu">
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="nav" id="menu-dinamico"></nav>
    </div>
  </header>

  <!-- Saudação, atalhos e resumo são preenchidos pelo JS/inicio.js. -->
  <main class="container main">
    <div class="welcome-section">
      <h1 id="saudacao">Carregando...</h1>
      <p id="subtitulo-saudacao"></p>
    </div>
    <div class="acoes-rapidas" id="acoes-rapidas"></div>
    <div class="resumo-dia" id="resumo-dia" style="display: none;"></div>
  </main>

  <!-- auth.js monta o menu; inicio.js escolhe a saudação e os atalhos. -->
  <script src="JS/auth.js"></script>
  <script src="JS/inicio.js"></script>
</body>
</html>
